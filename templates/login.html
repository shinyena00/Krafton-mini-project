{% extends "base.html" %}

{% block title %}
로그인
{% endblock %}

{% block content %}

<div class="signup-page">
    <h1 style="text-align:center; margin-bottom:50px;font-size:60px">로그인</h1>

    <form>
        <div class="rounded mb-4">
            <label>아이디</label>
            <input type="text" class="signform form-control mb-8">
        </div>
        <div class="rounded mb-4">
            <label>비밀번호</label>
            <input type="text" class="signform form-control mb-8">
        </div>
    </form>


    <div class="border rounded join p-3 mb-4" style="text-align:center;">
        로그인하기
    </div>

    <p class="signup" style="font-size: 15px; text-align:center;">
        <a href="{{url_for('signup')}}"">회원가입</a>
    </p>

</div>


{% endblock %}


{% block head %}

<style>
    main {
        text-align: left;
    }



    .signup-page {
        padding: 10% 30%;
    }

    .signup {
        color: gray;
    }

    .join {
        background-color: black;
        color: white;
    }


</style>

{% endblock %}

{% block scripts %}


{% endblock %}
