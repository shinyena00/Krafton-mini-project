{% extends "base.html" %}

{% block title %}
로그인
{% endblock %}

{% block content %}

<div class="signup-page">
    <h1 style="text-align:center; margin-bottom:50px;font-size:60px">로그인</h1>

    <form>
        <div class="rounded mb-4">
            <label>아이디</label>
            <input type="text" id="loginid" class="signform form-control mb-8">
        </div>
        <div class="rounded mb-4">
            <label>비밀번호</label>
            <input type="password" id="loginpassword" class="signform form-control mb-8">
        </div>

        <button type="button" onclick="loginCheck()" class="joinsubmit mb-4">로그인하기</button>

        
    </form>

    <p class="signup" style="font-size: 15px; text-align:center;">
        <a href="{{url_for('signup')}}"">회원가입</a>
    </p>

</div>


{% endblock %}


{% block head %}

<style>
    main {
        text-align: left;
    }



    .signup-page {
        padding: 10% 30%;
    }

    .signup {
        color: gray;
    }

    .join {
        background-color: black;
        color: white;
    }

    .joinsubmit {
        width: 100%;
        padding: 16px;
        background-color: black;
        color: white;
        border: none;
        border-radius: 8px;
        text-align: center;
    }


</style>

{% endblock %}

{% block scripts %}

<script>

    function loginCheck() {

        let loginid = $(" #loginid").val(); let loginpassword = $("#loginpassword").val(); $.ajax({
            type: "POST",
            url: "/login", data: { loginid: loginid, loginpassword: loginpassword }, success: function (response) {
                if (response.success == false) { alert("아이디/비밀번호가 틀렸습니다.") }
                else {
                    alert("로그인 성공\n 확인 버튼을 누르면 메인페이지로 이동합니다.")
                    location.href="/";
                }
            }
        })
    } </script>

            {% endblock %}
