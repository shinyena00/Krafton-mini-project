{% extends "base.html" %}

{% block title %}
마이페이지
{% endblock %}

{% block content %}

<div class="mypage col-10">
    <div class="userinfo">
        <img src="/static/images/default_profile.png" class="myprofile">
        <div>
            <h2>{{user.nickname}}</h2>
            <p>보유포인트 <strong>{{user.point}}P</strong></p>
        </div>
    </div>

    <hr>

    <div class="tab1 mb-3">
        <button type="button" class="active">내가 요청한</button>
        <button type="button">내가 수행한</button>
    </div>

    <hr class="m-0">

    <div class="tab2">
        <button type="button" class="active2">진행중</button>
        <button type="button">미진행</button>
        <button type="button">완료</button>
    </div>

    <hr class="m-0">

    <div class="errand_card">
        <div class="errand_item">
            <div class="errandcontent">
                <div class="mb-2 mt-3 mystatus">진행중</div>
                <h2 class="mb-3">편의점에서 생수 2병 부탁해요</h2>
                <p style="color:darkgrey;">정글 캠퍼스 1층 로비 20분 이내 2p</p>
                <p style="color:slategrey;">정글러 수진</p>
            </div>
            <div class="errand_button">
                <button type="button" class="confirmbutton">완료 확인</button>
                <button type="button" class="detailbutton">상세정보 확인</button>
            </div>
        </div>
        <hr class="m-0">
    </div>

</div>


{% endblock %}


{% block head %}

<style>
    main {
        text-align: left;
    }

    .mypage {
        padding: 0 5%;
    }

    .userinfo {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .tab1 {
        display: flex;
        gap: 40px;
        font-size: 15px;
    }

    .tab2 {
        display: flex;
        gap: 30px;
        font-size: 13px;
        background-color: #f7f7f7;
        padding: 5px 16px;
    }

    .errand_item {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 10px 2%;

    }

    .errandcontent {
        flex: 1;
    }

    .myprofile {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
    }

    .tab1 button,
    .tab2 button {
        border: none;
        background: none;
        padding: 2px 8px;
        cursor: pointer;
    }


    .active {
        font-weight: bold;
    }

    .active2 {
        font-weight: bold;
    }

    .confirmbutton {
        padding: 16px;
        background-color: black;
        color: white;
        border: none;
        border-radius: 8px;
        text-align: center;
    }

    .mystatus {
        display: inline-block;
        background-color: aliceblue;
        color: cornflowerblue;
        border: 1px solid cornflowerblue;
        border-radius: 8px;
        padding: 0 10px;
    }

    .errand_button {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .detailbutton {
        padding: 12px 16px;
        background-color: white;
        color: black;
        border: 1px solid #ccc;
        border-radius: 8px;
        cursor: pointer;
    }
</style>

{% endblock %}

{% block scripts %}

<script>

</script>

{% endblock %}
